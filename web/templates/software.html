<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="__DEMO__" />
    <meta name="theme-color" content="#090a0f" />
    <meta name="color-scheme" content="dark" />
    <title>ascii-tile-demos &mdash; __DEMO__ (software)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: #090a0f;
        overflow: hidden;
        width: 100%;
        height: 100%;
        overscroll-behavior: none;
      }
      canvas {
        display: block;
        touch-action: none;
        /* retroglyph-window sizes the canvas from the browser viewport at
           startup and on every resize event (winit's web backend does not
           derive canvas size from page CSS), so this only governs the first
           paint. The dvw/dvh pair follows the vw/vh fallback so mobile
           browsers with a retracting address bar don't leave a sliver of page
           scrollable underneath. */
        width: 100vw;
        height: 100vh;
        width: 100dvw;
        height: 100dvh;
      }
      #back {
        position: fixed;
        left: 0.75rem;
        bottom: 0.75rem;
        z-index: 10;
        font: 500 0.8rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #8b8ba3;
        background: rgba(9, 10, 15, 0.82);
        border: 1px solid #2b2e3d;
        border-radius: 5px;
        padding: 0.4rem 0.6rem;
        text-decoration: none;
      }
      #back:hover {
        color: #f6c460;
        border-color: #4a4d63;
      }
    </style>
  </head>
  <body>
    <a id="back" href="../../">&larr; all demos</a>
    <script type="module">
      import init from './__DEMO__.js';
      init();
    </script>
  </body>
</html>
