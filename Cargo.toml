[workspace]
members = ["crates/tilekit", "examples", "tools/gen-tileset", "tools/gen-thumbnails"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
authors = ["Matan Lurey <matan@lurey.org>"]
license = "MIT"
repository = "https://github.com/crates-lurey-io/ascii-tile-demos"
keywords = ["roguelike", "terminal", "tilemap", "gamedev"]
categories = ["game-development", "graphics"]

[workspace.dependencies]
# Pinned to a retroglyph git revision, not crates.io: the demos track APIs that
# have landed on main but are not published yet. Nothing here is a path
# dependency, so this repo still clones and builds standalone. Swap these back
# to version requirements once the next retroglyph release goes out.
retroglyph-core = { git = "https://github.com/crates-lurey-io/retroglyph", rev = "232d37c50eac3511472afd2da8e133b438b1e1dd" }
retroglyph-crossterm = { git = "https://github.com/crates-lurey-io/retroglyph", rev = "232d37c50eac3511472afd2da8e133b438b1e1dd" }
retroglyph-gl = { git = "https://github.com/crates-lurey-io/retroglyph", rev = "232d37c50eac3511472afd2da8e133b438b1e1dd" }
retroglyph-software = { git = "https://github.com/crates-lurey-io/retroglyph", rev = "232d37c50eac3511472afd2da8e133b438b1e1dd" }
retroglyph-terminal-wasm = { git = "https://github.com/crates-lurey-io/retroglyph", rev = "232d37c50eac3511472afd2da8e133b438b1e1dd" }
retroglyph-widgets = { git = "https://github.com/crates-lurey-io/retroglyph", rev = "232d37c50eac3511472afd2da8e133b438b1e1dd" }
retroglyph-window = { git = "https://github.com/crates-lurey-io/retroglyph", rev = "232d37c50eac3511472afd2da8e133b438b1e1dd" }
hexal = "0.1.1"
tilekit = { path = "crates/tilekit", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
must_use_candidate = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
module_name_repetitions = "allow"

# Demo code trades a little precision for readability: world generation and
# projection math is f32/f64 throughout and lands in u16/i32 grid coordinates,
# so the cast lints fire constantly for casts that are correct by construction
# (already clamped, already in range). Denying them repo-wide would mean an
# `allow` on nearly every rendering function.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

[profile.release]
opt-level = 3
lto = "thin"

# WASM bundles ship over the wire, so size wins over the last few percent of
# speed. `opt-level = "s"` plus fat LTO roughly halves the .wasm versus the
# default release profile.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
