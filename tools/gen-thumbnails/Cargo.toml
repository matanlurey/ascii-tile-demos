[package]
name = "gen-thumbnails"
version = "0.1.0"
description = "Renders a gallery thumbnail for every demo using the headless software backend"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Including a demo's source expands its `demo_main!` and resolves every
# `#[cfg(feature = ...)]` in it against *this* crate, not the one that defined
# the macro. `software` is therefore a real feature and on by default: without
# it `Demo::configure_software` is cfg'd out of this crate's copy of the source,
# the trait's do-nothing default is used instead, and a demo that registers a
# tileset silently renders its sprite codepoints as the font's fallback glyph.
#
# The other three backends deliberately get no stub feature. Declaring them
# would silence the `unexpected cfg condition value` warning for their arms, but
# `--all-features` would then turn them on and those arms name crates this tool
# has no reason to link (`retroglyph-gl` pulls in glutin/glow for a code path
# that is never called). `src/main.rs` allows the lint instead.
[features]
default = ["software"]
software = []

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tilekit.workspace = true
hexal.workspace = true
retroglyph-core.workspace = true
retroglyph-widgets.workspace = true
retroglyph-software.workspace = true
retroglyph-window.workspace = true
web-time = "1"

# The demos are `[[example]]` binaries, so there is no library to link against.
# `software` gives `Demo::configure_software` and the pixel buffer this reads.
ascii-tile-demos = { path = "../../examples", features = ["software"] }
