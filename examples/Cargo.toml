[package]
name = "ascii-tile-demos"
version = "0.1.0"
description = "A gallery of tiled overland map rendering techniques, in a character grid"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
tilekit.workspace = true
retroglyph-core.workspace = true
retroglyph-widgets.workspace = true
hexal.workspace = true
retroglyph-crossterm = { workspace = true, optional = true }
retroglyph-gl = { workspace = true, optional = true }
retroglyph-software = { workspace = true, optional = true }
retroglyph-window = { workspace = true, optional = true }
retroglyph-terminal-wasm = { workspace = true, optional = true }
# Portable `std::time::Instant`: a zero-cost re-export on native, backed by
# `Performance.now()` on wasm32. Already in the tree via winit.
web-time = "1"

[features]
default = []
crossterm = ["dep:retroglyph-crossterm"]
software = [
  "dep:retroglyph-software",
  "dep:retroglyph-window",
  "retroglyph-software/default-font",
  "retroglyph-software/tilesets",
]
gl = [
  "dep:retroglyph-gl",
  "dep:retroglyph-window",
  "retroglyph-gl/default-font",
  "retroglyph-gl/tilesets",
]
wasm-terminal = ["dep:retroglyph-terminal-wasm"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"
console_error_panic_hook = "0.1"

[dev-dependencies]
insta = { version = "1.34", features = ["yaml"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

